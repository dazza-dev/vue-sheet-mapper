name: Deploy demo and docs to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo
        run: pnpm run build:demo

      - name: Build docs
        run: pnpm run docs:build

      # The demo keeps the Pages root because npm and the release notes already
      # link to it; the docs sit one level down.
      - name: Combine into one site
        run: |
          mkdir -p site
          cp -r demo-dist/. site/
          mkdir -p site/docs
          cp -r docs/.vitepress/dist/. site/docs/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
